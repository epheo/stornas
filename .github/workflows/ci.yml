# Every job calls the same Makefile targets `make ci` runs locally;
# keep the two in lockstep by changing the Makefile, not this file.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
      - run: make lint
      - run: make types
      - name: fail on uncommitted generated TS types
        run: git diff --exit-code
      - run: go test ./...

  operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
      - run: make generate
      - name: fail on uncommitted generated diffs
        run: git diff --exit-code
      - run: make -C operator test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make web

  # Builds the DRBD 9 kmod against the base image kernel, then the full
  # bootc layer. A kernel/kmod mismatch must never publish; this is the gate.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make image
