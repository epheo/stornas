# Every job calls the same Makefile targets `make ci` runs locally;
# keep the two in lockstep by changing the Makefile, not this file.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      - run: make lint
      - run: make types
      - name: fail on uncommitted generated TS types
        run: git diff --exit-code
      - run: go test ./...

  operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: operator/go.mod
      - run: make generate
      - name: fail on uncommitted generated diffs
        run: git diff --exit-code
      - run: make -C operator test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make web

  # Builds the DRBD 9 kmod against the newest CentOS Stream kernel, then the full
  # bootc layer. A kernel/kmod mismatch must never publish; this is the gate.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # Registry archives are immutable per pinned list; restoring them keeps
      # the gate off quay.io and registry.k8s.io. Exact key only, so a bump
      # starts clean instead of dragging old archives along.
      - uses: actions/cache@v6.1.0
        with:
          path: .cache/registry-images
          key: registry-images-${{ hashFiles('image/embedded-images.txt') }}
      - run: make image
