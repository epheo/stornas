# Boot acceptance: build the appliance image, bootc-image-builder it to a
# qcow2, boot under qemu (KVM on the runner), and validate the whole stack
# via hack/boot-test.sh - the same harness shape as the microshift
# distro's own vm-test. Heavy on disk and time, so it never gates PRs.
# A green boot on main publishes ghcr.io/epheo/stornas-os: only images
# that booted ever reach consumers such as derived site images.
name: boot-test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH_REPO: ghcr.io/epheo/stornas-os
    steps:
      - uses: actions/checkout@v7.0.1
      - name: free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: install qemu and UEFI firmware
        run: |
          # The azure apt mirror can stall for hours; pin the main
          # archive and bound every apt call so a bad mirror fails the
          # step fast instead of eating the whole job timeout.
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources || true
          sudo timeout 120 apt-get update
          sudo timeout 600 apt-get install -y qemu-system-x86 ovmf
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: install playwright chromium for the UI phases
        run: npx playwright install --with-deps chromium
        working-directory: web
      # Nightly rebuilds of one commit differ (new kernel, new distro), so
      # the tag carries the date and run, not just the sha. The base is
      # resolved to a digest so the image records exactly what it sits on.
      - name: resolve version and base digest
        run: |
          echo "VERSION=$(date -u +%Y%m%d).${{ github.run_number }}.g${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          digest=$(skopeo inspect --format '{{.Digest}}' docker://ghcr.io/epheo/microshift:latest)
          echo "BASE_IMAGE=ghcr.io/epheo/microshift@${digest}" >> "$GITHUB_ENV"
      # Registry archives are immutable per pinned list; restoring them keeps
      # the gate off quay.io and registry.k8s.io. Exact key only, so a bump
      # starts clean instead of dragging old archives along.
      - uses: actions/cache@v6.1.0
        with:
          path: .cache/registry-images
          key: registry-images-${{ hashFiles('image/embedded-images.txt') }}
      - name: build the appliance image
        run: make image PODMAN=podman VERSION="$VERSION" BASE_IMAGE="$BASE_IMAGE"
      # No smoke step: microshift-in-container crash-loops on GH runners
      # (etcd/localhost churn); the distro's CI also runs only vm-test.
      # smoke stays a host-side dev tool.
      - name: boot and validate
        run: make vm-test PODMAN='sudo podman' VERSION="$VERSION"
      - name: publish
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push "localhost/stornas-os:$VERSION" "docker://$PUBLISH_REPO:$VERSION"
          podman push "localhost/stornas-os:$VERSION" "docker://$PUBLISH_REPO:latest"
      - name: collect console log on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vm-console
          path: |
            console.log
            ui-*-failed.png
          if-no-files-found: ignore
