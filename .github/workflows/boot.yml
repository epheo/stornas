# Boot acceptance: build the appliance image, bootc-image-builder it to a
# qcow2, boot under qemu (KVM on the runner), and validate the whole stack
# via hack/boot-test.sh - the same harness shape as the microshift
# distro's own vm-test. Heavy on disk and time, so it never gates PRs.
name: boot-test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: build the appliance image
        run: make image PODMAN=podman
      - name: boot and validate
        run: make vm-test PODMAN='sudo podman'
      - name: collect console log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vm-console
          path: /tmp/stornas-vm*/console.log
          if-no-files-found: ignore
