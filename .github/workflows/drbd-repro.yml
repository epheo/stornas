# Investigation harness, not a gate: reuses the replication-test two-VM
# bring-up (REPRO_SCRIPT hook) to compare DRBD split-brain behavior
# between a binder-bound WFFC volume and an Immediate-class volume.
# Always exits green; the product is the VERDICT lines and DRBD dumps
# in the log. Background: memory immediate-flip-blocked.
name: drbd-repro

on:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
      - name: free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: install qemu, UEFI firmware, dnsmasq
        run: |
          # The azure apt mirror can stall for hours; pin the main
          # archive and bound every apt call so a bad mirror fails the
          # step fast instead of eating the whole job timeout.
          # Runner sources may take their URIs from apt-mirrors.txt.
          # A file still naming the azure mirror means the pin missed.
          src="/etc/apt/sources.list /etc/apt/sources.list.d/*.list
            /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt"
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' $src || true
          if grep -qs azure.archive.ubuntu.com $src; then echo 'apt pin missed' >&2; exit 1; fi
          sudo timeout 120 apt-get update
          sudo timeout 600 apt-get install -y qemu-system-x86 ovmf dnsmasq nftables
          sudo systemctl stop dnsmasq 2>/dev/null || true
          sudo systemctl disable dnsmasq 2>/dev/null || true
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # Registry archives are immutable per pinned list; restoring them keeps
      # the gate off quay.io and registry.k8s.io. Exact key only, so a bump
      # starts clean instead of dragging old archives along.
      - uses: actions/cache@v6.1.0
        with:
          path: .cache/registry-images
          key: registry-images-${{ hashFiles('image/embedded-images.txt') }}
      - name: build the appliance image
        run: make image PODMAN=podman
      - name: drbd repro
        run: REPRO_SCRIPT=hack/drbd-repro-steps.sh make replication-test PODMAN='sudo podman'
      - name: collect console logs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: repro-consoles
          path: console*.log
          if-no-files-found: ignore
