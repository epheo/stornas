# Investigation harness, not a gate: reuses the replication-test two-VM
# bring-up (REPRO_SCRIPT hook) to compare DRBD split-brain behavior
# between a binder-bound WFFC volume and an Immediate-class volume.
# Always exits green; the product is the VERDICT lines and DRBD dumps
# in the log. Background: memory immediate-flip-blocked.
name: drbd-repro

on:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: install qemu, UEFI firmware, dnsmasq
        run: |
          # The azure apt mirror can stall for hours; pin the main
          # archive and bound every apt call so a bad mirror fails the
          # step fast instead of eating the whole job timeout.
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources || true
          for i in 1 2 3; do
            sudo timeout 120 apt-get update && break
            [ "$i" = 3 ] && exit 1
            sleep 10
          done
          sudo timeout 600 apt-get install -y qemu-system-x86 ovmf dnsmasq
          sudo systemctl stop dnsmasq 2>/dev/null || true
          sudo systemctl disable dnsmasq 2>/dev/null || true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: build the appliance image
        run: make image PODMAN=podman
      - name: drbd repro
        run: REPRO_SCRIPT=hack/drbd-repro-steps.sh make replication-test PODMAN='sudo podman'
      - name: collect console logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: repro-consoles
          path: /tmp/stornas-repl*/console*.log
          if-no-files-found: ignore
