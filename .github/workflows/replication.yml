# Two-VM replication acceptance: the heaviest gate (2 x 5GB VMs),
# nightly since it went green on runner-sized hardware (2026-08-06).
name: replication-test

on:
  workflow_dispatch:
  schedule:
    - cron: "47 4 * * *"

jobs:
  replication:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
      - name: free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: install qemu, UEFI firmware, dnsmasq
        run: |
          # The azure apt mirror can stall for hours; pin the main
          # archive and bound every apt call so a bad mirror fails the
          # step fast instead of eating the whole job timeout.
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources || true
          sudo timeout 120 apt-get update
          sudo timeout 600 apt-get install -y qemu-system-x86 ovmf dnsmasq
          # ubuntu's dnsmasq package starts a global instance; the test
          # runs its own on the bridge.
          sudo systemctl stop dnsmasq 2>/dev/null || true
          sudo systemctl disable dnsmasq 2>/dev/null || true
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: install playwright chromium for the UI phases
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: build the appliance image
        run: make image PODMAN=podman
      - name: replication test
        run: make replication-test PODMAN='sudo podman'
      - name: collect console logs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: repl-consoles
          path: |
            console*.log
            ui-*-failed.png
          if-no-files-found: ignore
