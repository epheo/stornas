# Merged over lvm.conf. A volume can hold a guest's own LVM: without
# these, udev autoactivation opens the guest VG through /dev/drbdN or the
# backing LV and holds the device on the host. Holds with or without a
# devices file: once a devices file exists LVM ignores global_filter and
# says so on stderr, harmless since only listed PVs are scanned then.
devices {
	global_filter = [ "r|^/dev/drbd|" ]
	scan_lvs = 0
}
