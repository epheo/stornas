apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - piraeus.yaml
# The piraeus render stays vendored; local intent lives here. Control
# plane pods pinned to the master: a worker death must not take the
# provisioning and failover path with it (failure matrix).
patches:
  - target:
      kind: Deployment
      name: piraeus-operator-controller-manager
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-role.kubernetes.io/control-plane: ""
  - target:
      kind: Deployment
      name: piraeus-operator-gencert
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-role.kubernetes.io/control-plane: ""
