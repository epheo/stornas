---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: shares.storage.stornas.io
spec:
  group: storage.stornas.io
  names:
    kind: Share
    listKind: ShareList
    plural: shares
    singular: share
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.claimName
      name: Claim
      type: string
    - jsonPath: .status.node
      name: Node
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Share is the Schema for the shares API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Share
            properties:
              claimName:
                description: claimName of a filesystem-mode PVC in the Share's namespace.
                type: string
              nfs:
                description: NFSExport configures the kernel nfsd export of a Share.
                properties:
                  clients:
                    description: |-
                      clients in exports(5) form, e.g. "192.168.1.0/24(rw,no_root_squash)".
                      The pattern is a security boundary, not linting: entries land
                      verbatim in the host's exports file, and whitespace would smuggle
                      in extra exports (the same rule the UI API enforces).
                    items:
                      maxLength: 256
                      pattern: ^[^\s()]+(\([^\s()]*\))?$
                      type: string
                    minItems: 1
                    type: array
                required:
                - clients
                type: object
              smb:
                description: SMBExport configures the samba share of a Share.
                properties:
                  name:
                    description: |-
                      name of the SMB share; defaults to the Share's name. The pattern
                      is a security boundary: the name lands verbatim in smb.conf, where
                      "]" or a newline would open a new section.
                    maxLength: 80
                    pattern: ^[A-Za-z0-9._-]+$
                    type: string
                  validUsers:
                    description: |-
                      validUsers references LocalUser names with smb enabled; object-name
                      shaped, so a crafted entry cannot extend the smb.conf line.
                    items:
                      maxLength: 253
                      pattern: ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$
                      type: string
                    type: array
                type: object
            required:
            - claimName
            type: object
            x-kubernetes-validations:
            - message: at least one of nfs or smb must be set
              rule: has(self.nfs) || has(self.smb)
          status:
            description: status defines the observed state of Share
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              device:
                type: string
              node:
                description: |-
                  node and device are the operator's placement decision: where the
                  backing LINSTOR resource is (or should become) primary and which
                  block device the agent mounts there. The agent only executes.
                type: string
              state:
                description: |-
                  Removed is the agent's teardown confirmation on a deleting share;
                  it releases the operator's finalizer.
                enum:
                - Pending
                - Exported
                - Failed
                - Removed
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
