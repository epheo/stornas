# Replication is a StorageClass choice, never an install mode.
# stornas-local skips the DRBD layer entirely: zero overhead on single node,
# and a volume can gain the layer later when a second node joins.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: stornas-local
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: linstor.csi.linbit.com
parameters:
  linstor.csi.linbit.com/storagePool: stornas
  linstor.csi.linbit.com/layerList: storage
  linstor.csi.linbit.com/placementCount: "1"
  # XFS everywhere (DESIGN.md); the CSI default is ext4, and the agent
  # mounts shares as xfs.
  csi.storage.k8s.io/fstype: xfs
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: stornas-replicated
provisioner: linstor.csi.linbit.com
parameters:
  linstor.csi.linbit.com/storagePool: stornas
  linstor.csi.linbit.com/layerList: drbd storage
  linstor.csi.linbit.com/placementCount: "2"
  # Two replicas cannot form quorum; suspend beats silent divergence, and
  # the UI owns the manual pick-survivor flow (DESIGN.md failure matrix).
  property.linstor.csi.linbit.com/DrbdOptions/auto-quorum: suspend-io
  property.linstor.csi.linbit.com/DrbdOptions/Net/protocol: C
  csi.storage.k8s.io/fstype: xfs
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
