# Replication is a StorageClass choice, never an install mode.
# stornas-local skips DRBD entirely: zero overhead on single node.
# tier names the StoragePool tier (r-drbd Pool spec.tier); the operator
# clones both classes for every other tier.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: stornas-local
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: r-drbd.io
parameters:
  tier: default
  replicas: "1"
  # XFS everywhere (README architecture); the agent mounts shares as xfs.
  csi.storage.k8s.io/fstype: xfs
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
# r-drbd runs every replicated volume with DRBD protocol C, quorum
# majority and suspend-io on quorum loss, with a diskless tiebreaker on a
# third node; none of it is a class parameter.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: stornas-replicated
provisioner: r-drbd.io
parameters:
  tier: default
  replicas: "2"
  csi.storage.k8s.io/fstype: xfs
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
