apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: host-drbd
spec:
  # The DRBD 9 kmod ships in the bootc image, matched to the kernel at
  # build time; the satellite's compile-on-node loader must not run (it
  # would need a registry and a compiler, both absent by design).
  # Target the DaemonSet, not the legacy Pod name: a Pod-targeted patch
  # only lands on a later reconcile, and the first render's loader pulls
  # drbd9-* from the registry, breaking the air gap.
  patches:
    - target:
        kind: DaemonSet
        name: linstor-satellite
      patch: |
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: linstor-satellite
        spec:
          template:
            spec:
              initContainers:
                - name: drbd-module-loader
                  $patch: delete
