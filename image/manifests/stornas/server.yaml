apiVersion: v1
kind: ServiceAccount
metadata:
  name: stornas-server
  namespace: stornas-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stornas-server
rules:
  # The clusterstate reflectors: read-only, exactly what the UI shows.
  - apiGroups: [storage.stornas.io]
    resources: [storagepools, targets, shares]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes, persistentvolumeclaims]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stornas-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stornas-server
subjects:
  - kind: ServiceAccount
    name: stornas-server
    namespace: stornas-system
---
# The auth layer: LocalUser lookups, first-boot admin bootstrap, and
# password Secret reads, all confined to the appliance namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stornas-server-auth
  namespace: stornas-system
rules:
  - apiGroups: [storage.stornas.io]
    resources: [localusers]
    verbs: [get, list, create]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stornas-server-auth
  namespace: stornas-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stornas-server-auth
subjects:
  - kind: ServiceAccount
    name: stornas-server
    namespace: stornas-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stornas-server
  namespace: stornas-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stornas-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stornas-server
    spec:
      serviceAccountName: stornas-server
      containers:
        - name: server
          image: ghcr.io/epheo/stornas:latest
          imagePullPolicy: Never # embedded via /usr/lib/embedded-images
          env:
            - name: STORNAS_WEB
              value: /usr/share/stornas/web
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: stornas
  namespace: stornas-system
spec:
  # NodePort keeps the UI reachable on the host without the router;
  # moving to 443 via the appliance front door comes with the auth layer.
  type: NodePort
  selector:
    app.kubernetes.io/name: stornas-server
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
