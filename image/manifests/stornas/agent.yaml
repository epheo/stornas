apiVersion: v1
kind: Namespace
metadata:
  name: stornas-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stornas-agent
  namespace: stornas-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stornas-agent
rules:
  - apiGroups: [storage.stornas.io]
    resources: [storagepools, shares, targets, localusers]
    verbs: [get, list, watch]
  - apiGroups: [storage.stornas.io]
    resources: [nodeinventories]
    verbs: [get, list, watch, create]
  - apiGroups: [storage.stornas.io]
    resources:
      [storagepools/status, shares/status, targets/status, nodeinventories/status]
    verbs: [get, update, patch]
---
# Secrets stay namespace-scoped: the agent reads LocalUser passwords via
# an uncached get, never a cluster list.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stornas-agent-secrets
  namespace: stornas-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stornas-agent-secrets
  namespace: stornas-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stornas-agent-secrets
subjects:
  - kind: ServiceAccount
    name: stornas-agent
    namespace: stornas-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stornas-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stornas-agent
subjects:
  - kind: ServiceAccount
    name: stornas-agent
    namespace: stornas-system
---
# MicroShift enforces SCCs; without this grant the DaemonSet controller
# cannot create the hostPID/privileged/hostPath agent pods at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stornas-scc-privileged
rules:
  - apiGroups: [security.openshift.io]
    resources: [securitycontextconstraints]
    resourceNames: [privileged]
    verbs: [use]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stornas-agent-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stornas-scc-privileged
subjects:
  - kind: ServiceAccount
    name: stornas-agent
    namespace: stornas-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: stornas-agent
  namespace: stornas-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: stornas-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stornas-agent
    spec:
      serviceAccountName: stornas-agent
      hostPID: true
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          # Pin by digest before release; :latest only while bootstrapping.
          image: ghcr.io/epheo/stornas-agent:latest
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: run-udev
              mountPath: /run/udev
            - name: run-lvm
              mountPath: /run/lvm
            - name: run-lock
              mountPath: /run/lock
            - name: etc-samba
              mountPath: /etc/samba
            - name: etc-exports
              mountPath: /etc/exports.d
            - name: shares
              mountPath: /var/lib/stornas
              # Mounts the agent performs via nsenter must appear here too.
              mountPropagation: HostToContainer
      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: run-udev
          hostPath:
            path: /run/udev
        - name: run-lvm
          hostPath:
            path: /run/lvm
            type: DirectoryOrCreate
        - name: run-lock
          hostPath:
            path: /run/lock
        - name: etc-samba
          hostPath:
            path: /etc/samba
        - name: etc-exports
          hostPath:
            path: /etc/exports.d
            type: DirectoryOrCreate
        - name: shares
          hostPath:
            path: /var/lib/stornas
            type: DirectoryOrCreate
