# This rule is not used by the project stornas-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the storage.stornas.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: stornas-operator
    app.kubernetes.io/managed-by: kustomize
  name: storagepool-editor-role
rules:
- apiGroups:
  - storage.stornas.io
  resources:
  - storagepools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - storage.stornas.io
  resources:
  - storagepools/status
  verbs:
  - get
