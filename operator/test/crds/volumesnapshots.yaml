# Envtest stand-in for the external snapshot CRD; the binder only reads
# spec.source.persistentVolumeClaimName, so the schema stays open.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: volumesnapshots.snapshot.storage.k8s.io
  annotations:
    # Protected group: the apiserver refuses *.k8s.io CRDs without the
    # approval annotation; value mirrors the real external-snapshotter CRD.
    api-approved.kubernetes.io: https://github.com/kubernetes-csi/external-snapshotter/pull/419
spec:
  group: snapshot.storage.k8s.io
  names:
    kind: VolumeSnapshot
    listKind: VolumeSnapshotList
    plural: volumesnapshots
    singular: volumesnapshot
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
